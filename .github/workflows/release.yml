name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed.' }

      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a vMAJOR.MINOR.PATCH tag.' }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed.' }
          $package = $metadata.packages | Where-Object name -eq 'codex-profiler'
          if ('v' + $package.version -cne $env:RELEASE_TAG) { throw 'Tag and Cargo.toml version disagree.' }

      - name: Check, test, and build Windows x64
        shell: pwsh
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting check failed.' }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed.' }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed.' }
          $env:RUSTFLAGS = "-C target-feature=+crt-static"
          cargo build --locked --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }

      - name: Test installer and package release
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Installer tests failed.' }
          ./scripts/package.ps1 -BinaryPath target/x86_64-pc-windows-msvc/release/codex-profiler.exe -Version $env:RELEASE_TAG.Substring(1) -OutputDir dist

      - name: Publish checked release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $archive = "CodexProfiler-$tag-windows-x64.zip"
          $releaseJson = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,assets 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.isDraft) { throw 'Release is already published; assets will not be overwritten.' }
            $names = @($release.assets | ForEach-Object name)
            if ($names -contains $archive -or $names -contains 'SHA256SUMS' -or $names -contains 'install.ps1') {
              throw 'Draft already has release assets. Review or remove the draft assets before retrying.'
            }
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "CodexProfiler $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          }
          gh release upload $tag "dist/$archive" dist/SHA256SUMS scripts/install.ps1 --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains a draft.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish draft release.' }
