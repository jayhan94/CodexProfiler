[package]
name = "codex-profiler"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
chrono = "0.4"
notify = "8"
walkdir = "2"
rusqlite = { version = "0.34", features = ["bundled"] }
fs2 = "0.4"

[profile.release]
lto = "thin"
strip = true
