[package]
name = "codex-profiler"
version = "0.2.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jayhan94/CodexProfiler"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
chrono = "0.4"
notify = "8"
walkdir = "2"
rusqlite = { version = "0.34", features = ["bundled"] }
fs2 = "0.4"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[profile.release]
lto = "thin"
strip = true
